
name: AeroGlass Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Verify build environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "AeroGlass Launcher repository is ready."
          echo "Android Gradle project will be added next."
          ls -la
